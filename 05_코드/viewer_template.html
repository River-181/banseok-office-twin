<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반석 3층 · 새 사무실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a36;--muted:#5e6b76;--paper:#f3f1ec;--card:rgba(255,255,255,.92);--line:#d8d3c8;--accent:#3f7f86;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e7ecef;--muted:#9aa7b1;--paper:#141a20;--card:rgba(24,31,38,.92);--line:#2c3740;--accent:#6fb3ba}}
:root[data-theme="dark"]{--ink:#e7ecef;--muted:#9aa7b1;--paper:#141a20;--card:rgba(24,31,38,.92);--line:#2c3740;--accent:#6fb3ba}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
.card{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
#head{top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:12px 14px;max-width:min(320px,calc(100% - 24px))}
#head h1{font-size:1.05rem;margin:0;font-weight:600}
#menu{display:none}
#head p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.4}
#views,.seatmode{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-size:.82rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#info{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;padding:10px 14px;min-width:200px;max-width:calc(100% - 24px);display:none}
#info button{position:absolute;top:6px;right:8px;border:none;padding:4px 8px;font-size:1rem;line-height:1}
#info b{display:block;font-size:.95rem}#info span{color:var(--muted);font-size:.8rem}
.callout{max-width:230px;background:var(--card);border:1px solid var(--accent);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;pointer-events:none}
.callout b{display:block;font-size:.82rem;margin-bottom:2px}
.callout span{font-size:.72rem;color:var(--muted);line-height:1.35}
.poi{font-size:.66rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap;pointer-events:none}
.seat{font-size:.68rem;color:#fff;background:var(--accent);border-radius:3px;padding:0 4px;white-space:nowrap;pointer-events:none;opacity:.92}
.room{font-size:.72rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;pointer-events:none}
#play{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 14px;display:flex;flex-direction:column;gap:8px}
#play .row{display:flex;align-items:center;gap:10px}
#clock{font-variant-numeric:tabular-nums;font-weight:600;min-width:58px}
#stat{color:var(--muted);font-size:.78rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#seek{flex:1;accent-color:var(--accent);height:26px}
#compass{top:calc(12px + env(safe-area-inset-top,0px));right:12px;padding:8px 10px;font-size:.75rem;color:var(--muted)}
@media (max-width:720px){
  #head{left:8px;right:8px;max-width:none;padding:10px 12px;top:calc(8px + env(safe-area-inset-top,0px))}
  #head p{display:none}
  #head.collapsed #views,#head.collapsed .seatmode{display:none}
  #menu{display:inline-block;position:absolute;top:8px;right:8px;padding:6px 10px}
  #views,.seatmode{gap:8px;margin-top:8px}
  button{font-size:.85rem;padding:9px 13px}
  #compass{display:none}
  .room{font-size:.68rem}.seat{font-size:.62rem}
  #info{left:8px;right:8px;bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:14px 16px 16px}
  #play{left:8px;right:8px;padding:10px 12px}
  #stat{font-size:.72rem}
  .callout{max-width:200px;padding:7px 9px}
  #info b{font-size:1.05rem}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="head" class="card">
  <h1>반석 3층 · 새 사무실</h1>
  <button id="menu" aria-label="메뉴">☰</button>
  <p>북유성대로 336 · 드래그로 회전, 휠로 확대, 자리를 누르면 정보가 떠요</p>
  <div id="views">
    <button data-view="overview" aria-pressed="true">전체</button>
    <button data-view="top">위에서</button>
    <button data-view="road">북유성대로 쪽</button>
    <button data-view="entrance">출입문에서</button>
    <button data-view="site">건물·주변</button>
    <button data-view="cars">주차장</button>
    <button id="labels" aria-pressed="true">방 이름</button>
    <button id="upper" aria-pressed="false">위층</button>
    <button id="shell" aria-pressed="true">외관</button>
    <button id="ceil" aria-pressed="false">천장</button>
    <button id="people" aria-pressed="true">사람</button>
    <button id="qual">품질: 보통</button>
    <button id="notes" aria-pressed="false">설명</button>
    <button id="tour">가이드 ◀▶</button>
    <button id="noise" aria-pressed="false">소음맵</button>
  </div>
  <div class="seatmode">
    <button data-seat="seat" aria-pressed="true">좌석번호</button>
    <button data-seat="role">역할</button>
    <button data-seat="name">이름</button>
    <button data-seat="off">끔</button>
  </div>
</div>
<div id="compass" class="card">도면 위쪽 = 북동(코어)</div>
<div id="play" class="card">
  <div class="row"><button id="pp">▶︎</button><span id="clock">09:00</span><button id="speed">×60</button><span id="stat">하루 재생 · 09:00 시작</span></div>
  <div class="row"><input id="seek" type="range" min="0" max="540" value="0" step="1"></div>
</div>
<div id="info" class="card"><button id="info-close" aria-label="닫기">×</button><b id="info-title"></b><span id="info-sub"></span></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const INFO = __INFO__;
const LABELS = __LABELS__;
const SEATS = __SEATS__;
const FLOOR_Y = __FLOOR_Y__;
const PARK = __PARK__;
const REPLAY = __REPLAY__;
const SIGNS = __SIGNS__;
const CALLOUTS = __CALLOUTS__;
const NOISE = __NOISE__;
const HAS_NAMES = __HAS_NAMES__;
const GLB = "__GLB__";

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
const MOBILE = matchMedia("(max-width:720px)").matches || matchMedia("(pointer:coarse)").matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.6 : 2));
renderer.logarithmicDepthBuffer = false;
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = "position:absolute;inset:0;pointer-events:none";
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.4, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.enablePan = true; controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.9;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(2, FLOOR_Y + 25, 30); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 });
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;  // kills shadow acne on large flat slabs
sun.target.position.set(10.7, FLOOR_Y, 7.8); scene.add(sun, sun.target);

const CENTER = new THREE.Vector3(10.7, FLOOR_Y, 7.775);
const VIEWS = {
  overview: [new THREE.Vector3(1, FLOOR_Y + 16, 25), CENTER],
  top: [new THREE.Vector3(10.7, FLOOR_Y + 27, 7.8), CENTER],
  road: [new THREE.Vector3(10.7, FLOOR_Y + 1.6, 30), new THREE.Vector3(10.7, FLOOR_Y + 1.2, 7)],
  entrance: [new THREE.Vector3(14.9, FLOOR_Y + 1.6, -1.2), new THREE.Vector3(9, FLOOR_Y + 1.1, 9)],
  site: [new THREE.Vector3(-70, 60, 120), new THREE.Vector3(12, 8, 12)],
  cars: [new THREE.Vector3(PARK[0] + 16, PARK[1] + 9, PARK[2] + 30), new THREE.Vector3(PARK[0] + 3.5, PARK[1], PARK[2] + 8)],
};
const layers = { BLD_UP: [], BLD: [], SITE: [], CEIL: [], PEOPLE: [], SIGNS: [], NOTES: [] };
function setLayer(prefix, on, buttonId) {
  layers[prefix].forEach(o => o.visible = on);
  if (buttonId) document.getElementById(buttonId).setAttribute("aria-pressed", on);
}
const tween = { on: false, t: 0, fromP: new THREE.Vector3(), fromT: new THREE.Vector3(), toP: new THREE.Vector3(), toT: new THREE.Vector3() };
function flyTo(pos, target, instant = false) {
  if (instant) { camera.position.copy(pos); controls.target.copy(target); controls.update(); return; }
  tween.fromP.copy(camera.position); tween.fromT.copy(controls.target);
  tween.toP.copy(pos); tween.toT.copy(target); tween.t = 0; tween.on = true;
}
function stepTween(dt) {
  if (!tween.on) return;
  tween.t = Math.min(1, tween.t + dt / 0.9);
  const e = tween.t < 0.5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;   // ease in-out
  camera.position.lerpVectors(tween.fromP, tween.toP, e);
  controls.target.lerpVectors(tween.fromT, tween.toT, e);
  controls.update();
  if (tween.t >= 1) tween.on = false;
}
function go(name) {
  const [pos, target] = VIEWS[name];
  setLayer("BLD_UP", name === "site" || name === "cars", "upper");
  flyTo(pos, target, !scene.children.length);
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === name));
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));

const labelObjects = LABELS.map(l => {
  const el = document.createElement("div"); el.className = "room"; el.textContent = l.name.replace(/ \(라벨 잘림\)/, "");
  const o = new CSS2DObject(el); o.position.set(l.x, FLOOR_Y + 2.8, l.z); scene.add(o); return o;
});
document.getElementById("labels").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on); labelObjects.forEach(o => o.visible = on);
};

const seatObjects = SEATS.map(s => {
  const el = document.createElement("div"); el.className = "seat";
  const o = new CSS2DObject(el); o.position.set(s.x, FLOOR_Y + 1.25, s.z); o.userData.id = s.id; scene.add(o); return o;
});
function seatMode(mode) {
  seatObjects.forEach(o => {
    const m = INFO[o.userData.id];
    const text = mode === "seat" ? m.seat : mode === "role" ? m.label.replace(/\(.*\)/, "") : mode === "name" ? m.name : "";
    o.element.textContent = text; o.visible = Boolean(text);
  });
  document.querySelectorAll("[data-seat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.seat === mode));
}
document.querySelectorAll("[data-seat]").forEach(b => b.onclick = () => seatMode(b.dataset.seat));
if (!HAS_NAMES) document.querySelector('[data-seat="name"]').remove();
seatMode(MOBILE ? "off" : "seat");

const QUALITY = [["낮음", 1, false, 512], ["보통", 1.5, true, 1024], ["높음", 2, true, 2048]];
let qi = MOBILE ? 0 : 1;
function setQuality(i) {
  const [name, dpr, shadow, map] = QUALITY[qi = (i + QUALITY.length) % QUALITY.length];
  renderer.setPixelRatio(Math.min(devicePixelRatio, dpr));
  renderer.shadowMap.enabled = shadow;
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  sun.shadow.mapSize.set(map, map);
  sun.castShadow = shadow;
  scene.traverse(o => { if (o.isMesh && o.material) o.material.needsUpdate = true; });
  document.getElementById("qual").textContent = `품질: ${name}`;
  resize();
}
document.getElementById("qual").onclick = () => setQuality(qi + 1);
document.getElementById("ceil").onclick = e => setLayer("CEIL", e.currentTarget.getAttribute("aria-pressed") !== "true", "ceil");
document.getElementById("people").onclick = e => setLayer("PEOPLE", e.currentTarget.getAttribute("aria-pressed") !== "true", "people");
document.getElementById("upper").onclick = e => setLayer("BLD_UP", e.currentTarget.getAttribute("aria-pressed") !== "true", "upper");
document.getElementById("shell").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  setLayer("BLD", on, "shell"); setLayer("SITE", on); setLayer("SIGNS", on);
};
const signTags = SIGNS.map(s => {
  const el = document.createElement("div"); el.className = "poi";
  el.textContent = `${s.name} ${s.m}m · 도보 ${s.min}분`;
  const o = new CSS2DObject(el); o.position.set(s.pos[0], s.pos[1], s.pos[2]); scene.add(o);
  return o;
});
layers.SIGNS = signTags;
const calloutObjs = CALLOUTS.map(([x, z, dy, title, body]) => {
  const el = document.createElement("div"); el.className = "callout";
  el.innerHTML = `<b></b><span></span>`;
  el.querySelector("b").textContent = title; el.querySelector("span").textContent = body;
  const card = new CSS2DObject(el);
  card.position.set(x, FLOOR_Y + dy, z);
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, FLOOR_Y + 0.75, z), new THREE.Vector3(x, FLOOR_Y + dy, z)]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x3f7f86 }));
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), new THREE.MeshBasicMaterial({ color: 0x3f7f86 }));
  dot.position.set(x, FLOOR_Y + 0.75, z);
  scene.add(card, line, dot);
  return { card, line, dot, x, z, dy, title };
});
layers.NOTES = calloutObjs.flatMap(c => [c.card, c.line, c.dot]);
setLayer("NOTES", false, "notes");
let tourAt = -1;
function showNotes(on) { setLayer("NOTES", on, "notes"); }
document.getElementById("notes").onclick = e => showNotes(e.currentTarget.getAttribute("aria-pressed") !== "true");
document.getElementById("tour").onclick = () => {
  showNotes(true);
  tourAt = (tourAt + 1) % calloutObjs.length;
  const c = calloutObjs[tourAt];
  const eye = new THREE.Vector3(c.x + 4.5, FLOOR_Y + 3.2, c.z + 5.5);
  flyTo(eye, new THREE.Vector3(c.x, FLOOR_Y + 1.0, c.z));
  document.getElementById("stat").textContent = `가이드 ${tourAt + 1}/${calloutObjs.length} · ${c.title}`;
};
const parkLabel = document.createElement("div"); parkLabel.className = "room";
parkLabel.textContent = "주차장 · 실제로는 다른 곳 (위치 미정)";
const parkTag = new CSS2DObject(parkLabel); parkTag.position.set(PARK[0] + 3.5, PARK[1] + 3.2, PARK[2] + 8); scene.add(parkTag);

// ---------- noise heat map (L2) ----------
let noisePlane = null, noiseBare = false;
function noiseTexture(cells) {
  const nz = cells.length, nx = cells[0].length;
  const cv = document.createElement("canvas"); cv.width = nx; cv.height = nz;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(nx, nz);
  const lo = 45, hi = 68;                                  // dB range mapped to the colour ramp
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const u = Math.max(0, Math.min(1, (cells[j][i] - lo) / (hi - lo)));
    const k = (j * nx + i) * 4;
    img.data[k] = Math.round(40 + 215 * u);                // quiet teal -> loud red
    img.data[k + 1] = Math.round(150 - 110 * u);
    img.data[k + 2] = Math.round(150 - 130 * u);
    img.data[k + 3] = 165;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv); tex.magFilter = THREE.LinearFilter; return tex;
}
function buildNoise() {
  if (!NOISE.grid) return;
  const cell = NOISE.meta.cell, nz = NOISE.grid.length, nx = NOISE.grid[0].length;
  const geo = new THREE.PlaneGeometry(nx * cell, nz * cell);
  noisePlane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: noiseTexture(NOISE.grid), transparent: true, depthWrite: false }));
  noisePlane.rotation.x = -Math.PI / 2;
  noisePlane.position.set(nx * cell / 2, FLOOR_Y + 0.03, nz * cell / 2);
  noisePlane.visible = false;
  scene.add(noisePlane);
}
buildNoise();
document.getElementById("noise").onclick = e => {
  const btn = e.currentTarget;
  if (!noisePlane) return;
  if (!noisePlane.visible) { noisePlane.visible = true; noiseBare = false; btn.setAttribute("aria-pressed", true); btn.textContent = "소음맵 (현재안)"; }
  else if (!noiseBare) { noiseBare = true; noisePlane.material.map = noiseTexture(NOISE.bare); btn.textContent = "소음맵 (가벽 제거)"; }
  else { noisePlane.visible = false; noiseBare = false; noisePlane.material.map = noiseTexture(NOISE.grid); btn.setAttribute("aria-pressed", false); btn.textContent = "소음맵"; }
  const z = NOISE.zones["국세외 전화 구역"];
  if (noisePlane.visible && z) document.getElementById("stat").textContent = `소음맵 · 전화 구역 평균 ${z.mean} dB, 최대 ${z.max} dB (통화 35% 가정)`;
};

const bytes = Uint8Array.from(atob(GLB), c => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, "", gltf => {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = !o.material.transparent;
    const prefix = ["BLD_UP", "BLD", "SITE", "CEIL", "PEOPLE"].find(p => o.name.startsWith(p + "_"));
    if (prefix) layers[prefix].push(o);
  });
  scene.add(gltf.scene);
  collectActors(gltf.scene);
  applyTime(clockT);
  setLayer("BLD_UP", false, "upper");
  setLayer("CEIL", false, "ceil");
});

const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
const keyOf = n => INFO[n] ? n : INFO[n.split("_")[0]] ? n.split("_")[0] : null;
const panel = document.getElementById("info");
let picked = null;
function select(obj) {
  if (picked) { picked.material = picked.userData.baseMat; picked = null; }
  if (!obj) { panel.style.display = "none"; return; }
  obj.userData.baseMat = obj.material;
  obj.material = obj.material.clone(); obj.material.emissive = new THREE.Color(0x3f7f86); obj.material.emissiveIntensity = 0.6;
  picked = obj;
  const meta = INFO[keyOf(obj.name)] || INFO[keyOf(obj.parent?.name || "")];
  document.getElementById("info-title").textContent = meta ? [meta.seat, meta.name || meta.label].filter(Boolean).join("  ") : obj.name;
  document.getElementById("info-sub").textContent = meta ? [meta.name ? meta.label : "", meta.where, meta.equip.join(" · ")].filter(Boolean).join(" — ") : "";
  panel.style.display = "block";
}
let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object.isMesh && !h.object.material.transparent && (keyOf(h.object.name) || keyOf(h.object.parent?.name || "")));
  select(hit ? hit.object : null);
});

const head = document.getElementById("head");
if (MOBILE) head.classList.add("collapsed");
document.getElementById("menu").onclick = () => head.classList.toggle("collapsed");
document.getElementById("info-close").onclick = () => select(null);
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { if (MOBILE) head.classList.add("collapsed"); }));

// ---------- day replay ----------
const BREAK_POS = new THREE.Vector3(5.5, FLOOR_Y, 2.0);      // 탕비실
const EXIT_POS = new THREE.Vector3(15.0, FLOOR_Y, -1.4);     // 출입문 / 엘리베이터 홀
const persons = new Map();   // seat_no -> { meshes, home, state }
const carGroups = new Map(); // vehicle id -> meshes
let clockT = 0, playing = false, speed = 60;

function collectActors(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    for (const [seat, p] of Object.entries(REPLAY.people)) {
      if (o.name === `PEOPLE_${p.chair}` || o.name === `PEOPLE_${p.chair}_skin` || o.name === `PEOPLE_${p.chair}_hair`) {
        if (!persons.has(seat)) persons.set(seat, { meshes: [], home: new THREE.Vector3(p.pos[0], FLOOR_Y, p.pos[1]), track: p.states });
        persons.get(seat).meshes.push(o);
      }
    }
    const car = o.name.match(/^(EV6-\d|KONA-\d)_/);
    if (car) { if (!carGroups.has(car[1])) carGroups.set(car[1], []); carGroups.get(car[1]).push(o); }
  });
}
const CORRIDOR_Z = 3.6;              // aisle people walk along instead of through desks
const WALK_MIN = 1.2;                // sim minutes a walk takes
function stateAt(track, t) {
  let cur = ["desk", 0];
  for (const [tt, v] of track) { if (tt <= t) cur = [v, tt]; else break; }
  return cur;
}
function prevState(track, t) {
  let prev = "desk";
  for (const [tt, v] of track) { if (tt < stateAt(track, t)[1]) prev = v; else break; }
  return prev;
}
function anchorFor(state, home) {
  return state === "break" ? BREAK_POS : (state === "lunch" || state === "off") ? EXIT_POS : home;
}
function walkPoint(from, to, u) {          // L-shaped route: out to the corridor, across, then in
  const p = new THREE.Vector3();
  const a = from.clone(), b = to.clone();
  const mid1 = new THREE.Vector3(a.x, a.y, CORRIDOR_Z), mid2 = new THREE.Vector3(b.x, b.y, CORRIDOR_Z);
  const legs = [[a, mid1], [mid1, mid2], [mid2, b]];
  const lens = legs.map(([p0, p1]) => p0.distanceTo(p1));
  const total = lens.reduce((s, v) => s + v, 0) || 1;
  let d = u * total;
  for (let i = 0; i < legs.length; i++) {
    if (d <= lens[i] || i === legs.length - 1) return p.lerpVectors(legs[i][0], legs[i][1], lens[i] ? Math.min(1, d / lens[i]) : 1);
    d -= lens[i];
  }
  return p.copy(b);
}

function teamStatus(team, t) {
  let cur = null;
  for (const e of team.events) { if (e.t <= t) cur = e; else break; }
  if (!cur || cur.what === "복귀" || cur.what === "서류정리") return { offsite: false, text: cur ? `${team.name} 사무실 (${cur.what})` : `${team.name} 대기` };
  const offsite = ["출차", "이동", "실태확인", "부재확인"].includes(cur.what);
  return { offsite, text: `${team.name} ${cur.what}${cur.where ? " · " + cur.where : ""}${cur.soc ? " · 배터리 " + Math.round(cur.soc * 100) + "%" : ""}` };
}

function applyTime(t) {
  for (const [, p] of persons) {
    const [st, since] = stateAt(p.track, t);
    const from = anchorFor(prevState(p.track, t), p.home);
    const to = anchorFor(st, p.home);
    const u = Math.max(0, Math.min(1, (t - since) / WALK_MIN));
    const pos = u >= 1 ? to : walkPoint(from, to, u);
    const bob = u > 0 && u < 1 ? Math.abs(Math.sin(u * 26)) * 0.05 : 0;
    const d = pos.clone().sub(p.home);
    p.meshes.forEach(m => { m.visible = !(st === "off" && u >= 1); m.position.set(d.x, bob, d.z); });
  }
  const statuses = REPLAY.teams.map(team => {
    const s = teamStatus(team, t);
    const vid = (team.events.find(e => e.vehicle) || {}).vehicle;
    if (vid && carGroups.has(vid)) {
      const meshes = carGroups.get(vid);
      if (!s.offsite) { meshes.forEach(m => m.position.set(0, 0, 0)); }
      else {                                   // drive down 북유성대로 instead of vanishing
        const lap = ((t * 0.6) % 20) / 20;
        const road = new THREE.Vector3(-20 + lap * 70, -PARK[1] + 0.05, 28.5);
        meshes.forEach(m => m.position.set(road.x - PARK[0], road.y, road.z - PARK[2]));
      }
      meshes.forEach(m => m.visible = true);
    }
    return s.text;
  });
  const k = REPLAY.kpi[Math.min(REPLAY.kpi.length - 1, Math.round(t / 5))] || [0, 0, 0, 0];
  const hh = String(9 + Math.floor(t / 60)).padStart(2, "0"), mm = String(Math.floor(t % 60)).padStart(2, "0");
  document.getElementById("clock").textContent = `${hh}:${mm}`;
  document.getElementById("seek").value = t;
  document.getElementById("stat").textContent = `통화중 ${k[3]}명 · 처리 ${k[2]}건 · ${statuses.join(" / ")}`;
}
document.getElementById("pp").onclick = e => { playing = !playing; e.currentTarget.textContent = playing ? "❙❙" : "▶︎"; };
document.getElementById("speed").onclick = e => { speed = { 60: 180, 180: 600, 600: 60 }[speed]; e.currentTarget.textContent = "×" + speed; };
document.getElementById("seek").oninput = e => { clockT = +e.target.value; applyTime(clockT); };
let last = performance.now();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize(); setQuality(qi); go("overview");
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  stepTween(dt);
  if (playing) {
    clockT += dt * speed / 60;
    if (clockT > REPLAY.day) { clockT = REPLAY.day; playing = false; document.getElementById("pp").textContent = "▶︎"; }
    applyTime(clockT);
  }
  controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera);
});
</script>
